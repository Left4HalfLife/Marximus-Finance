<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Settings{% endblock %} · Marximus Finance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='builder.css') }}">
</head>
<body>
  <header><nav aria-label="Main navigation">
    <a class="brand" href="{{ url_for('.home') }}">Marximus Finance</a>
    {% for item in nav %}
      <a href="{{ url_for('.listing', module_id=item.id) }}"{% if module and module.id == item.id and request.endpoint not in ['builder.settings','builder.design'] %} aria-current="page"{% endif %}>{{ item.name }}</a>
    {% endfor %}
    <a class="settings" href="{{ url_for('.settings') }}"{% if request.endpoint in ['builder.settings','builder.design'] %} aria-current="page"{% endif %}>Settings</a>
  </nav></header>
  <main>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
